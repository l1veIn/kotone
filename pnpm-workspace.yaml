packages:
  - "apps/*"

# pnpm 10+ 配置统一放在 pnpm-workspace.yaml（package.json 的 pnpm 字段已弃用）
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true

# 安全补丁的最低版本（2026-11-17 pnpm audit；只选发布满两周的补丁版本）
overrides:
  devalue@<5.9.4: 5.9.4
  nanoid@<3.3.20: 3.3.20
  postcss@<8.5.23: 8.5.23
  source-map-js@<1.2.2: 1.2.2
  vite@<6.4.5: 6.4.5
