name: Isolated 0.1.14 upgrade smoke

on:
  workflow_dispatch:
    inputs:
      smoke_kind:
        description: Check guest audio, old app input, or the full upgrade
        required: true
        default: preflight
        type: choice
        options: [preflight, baseline, full]

permissions:
  contents: read

jobs:
  isolated-windows:
    if: github.ref == 'refs/heads/codex/smoke-0.1.14-isolated'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the guest desktop and virtual microphone
        shell: pwsh
        run: ./scripts/manual-e2e/smoke_014_preflight.ps1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: inputs.smoke_kind == 'full'
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.smoke_kind == 'full'
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: inputs.smoke_kind == 'full'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: inputs.smoke_kind == 'full'
        with:
          workspaces: .
          cache-directories: target/sherpa-onnx-prebuilt
          prefix-key: v2-rust
          cache-on-failure: true
      - name: Build the 0.1.14 maintenance installer
        if: inputs.smoke_kind == 'full'
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm release:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C apps/desktop tauri build --ci --no-sign --bundles nsis --config src-tauri/tauri.ci.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the synthetic audio sender
        if: inputs.smoke_kind != 'preflight'
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: sounddevice==0.5.3
      - name: Verify input on the published 0.1.13 installer
        if: inputs.smoke_kind == 'baseline'
        shell: pwsh
        run: ./scripts/manual-e2e/smoke_014_install.ps1 -BaselineOnly
      - name: Install 0.1.13, verify input, upgrade in place, and verify rollback
        if: inputs.smoke_kind == 'full'
        shell: pwsh
        run: |
          ./scripts/manual-e2e/smoke_014_install.ps1 -CandidateInstaller './target/release/bundle/nsis/Kotone_0.1.14_x64-setup.exe'
      - name: Show the disposable app's diagnostic log
        if: failure()
        shell: pwsh
        run: |
          $homeDir = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.kotone'
          foreach ($name in @('kotone.log', 'diagnostics/events.jsonl')) {
            $log = Join-Path $homeDir $name
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
          }
