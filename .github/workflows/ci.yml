name: Isolated 0.1.15 cold recording

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Full commit ID of the 0.1.15 maintenance candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolated-windows:
    if: github.ref == 'refs/heads/codex/smoke-0.1.15-isolated'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate the exact candidate commit
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.product_sha }}
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected a full commit SHA.' }
          git fetch --depth=1 origin refs/heads/codex/maint-0.1.15
          if ($LASTEXITCODE -ne 0 -or (git rev-parse FETCH_HEAD) -cne $env:CANDIDATE_SHA) {
            throw 'The requested SHA does not match the maintenance branch head.'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.product_sha }}
          path: candidate
          persist-credentials: false
      - name: Prepare the guest virtual microphone
        shell: pwsh
        run: |
          # Reuse the proven driver setup. Only extend its allowlist for this guest.
          foreach ($file in @('smoke_014_preflight.ps1','smoke_014_register_cable.ps1')) {
            $path = Join-Path 'scripts/manual-e2e' $file
            $code = (Get-Content -LiteralPath $path -Raw).Replace('refs/heads/codex/smoke-0.1.14-isolated', 'refs/heads/codex/smoke-0.1.15-isolated')
            Set-Content -LiteralPath $path -Value $code -Encoding utf8NoBOM
          }
          ./scripts/manual-e2e/smoke_014_preflight.ps1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate
          cache-directories: candidate/target/sherpa-onnx-prebuilt
          prefix-key: v2-rust
          cache-on-failure: true
      - name: Build an unsigned local candidate
        shell: pwsh
        working-directory: candidate
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm release:verify v0.1.15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C apps/desktop tauri build --ci --no-sign --no-bundle --config src-tauri/tauri.ci.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify first speech at startup and after idle model release
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: sounddevice==0.5.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/manual-e2e/smoke_015_cold.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
