name: Isolated 0.1.14 upgrade smoke

on:
  workflow_dispatch:
    inputs:
      smoke_kind:
        description: Preflight desktop and audio, or test the full upgrade
        required: true
        default: preflight
        type: choice
        options: [preflight, full]

permissions:
  contents: read

jobs:
  isolated-windows:
    if: github.ref == 'refs/heads/codex/smoke-0.1.14-isolated'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the guest desktop and virtual microphone
        shell: pwsh
        run: ./scripts/manual-e2e/smoke_014_preflight.ps1
