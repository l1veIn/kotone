name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/desktop exec playwright install chromium

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Verify tag and application version
        run: pnpm release:verify
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Check desktop UI
        run: pnpm check

      - name: Test desktop journeys
        run: pnpm -C apps/desktop test:e2e

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build draft GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 签名（私钥与密码保管在仓库 Secrets；
          # 对应公钥写在 apps/desktop/src-tauri/tauri.conf.json 的 plugins.updater.pubkey）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Kotone ${{ github.ref_name }}"
          releaseBody: |
            面向 Windows 游戏玩家的本地语音输入工具。

            完整变更与安装说明见仓库中的 CHANGELOG 与 README。
          releaseDraft: true
          generateReleaseNotes: true

      - name: Generate and upload updater manifests with mirror fallbacks
        # tauri-action 会上传自己的 latest.json（api.github.com 临时 asset 地址）；
        # 这里用 scripts/make-updater-jsons.mjs 重建为稳定的 releases/download 直链，
        # 并生成四个镜像变体（updater endpoints 多镜像回退链所需的 latest-cn-*.json），
        # 以 --clobber 覆盖同名附件。
        shell: pwsh
        run: |
          $installer = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" } | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced."
          }
          node scripts/make-updater-jsons.mjs --exe $installer.FullName --sig "$($installer.FullName).sig" --tag "${{ github.ref_name }}"
          $dir = $installer.DirectoryName
          gh release upload "${{ github.ref_name }}" `
            (Join-Path $dir "latest.json") `
            (Join-Path $dir "latest-cn-ghfast.json") `
            (Join-Path $dir "latest-cn-ghproxy.json") `
            (Join-Path $dir "latest-cn-ghproxynet.json") `
            (Join-Path $dir "latest-cn-llkk.json") `
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload SHA-256 checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" }
          if (-not $installers) {
            throw "No NSIS installer was produced."
          }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE "SHA256SUMS.txt"
          $lines | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumPath --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
