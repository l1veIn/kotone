name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # 查这个提交在 ci.yml 有没有跑绿（见下面 Look for a green CI run of this commit）
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    # 测试约 21 分钟 + 构建安装包约 31 分钟：rc.4 用了 60 分 06 秒，最后保存 Rust 缓存那一步被掐掉。
    # 现在这个提交在 CI 跑绿了就不再测（最多等 CI 25 分钟），也不再存 Rust 缓存。
    timeout-minutes: 90
    env:
      # 环境变量优先于 .cargo/config.toml 的 jobs = 1；和 ci.yml 的 Rust test 一样用 2
      # （也是为了用得上它的缓存：缓存的 key 里有 CARGO_* 环境变量）
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse to rebuild an already published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Windows runner 上 pwsh 默认 ErrorActionPreference=Stop，且步骤退出码
          # 会继承最后一条原生命令。首次打 tag 时 gh release view 404 必须吞掉，
          # 再显式 exit 0，否则守卫自己把发版打断。
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $json = gh release view $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          $viewExit = $LASTEXITCODE
          if ($viewExit -eq 0 -and $json) {
            $release = $json | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:GITHUB_REF_NAME is already published; refusing to overwrite its assets."
            }
            Write-Host "Existing draft release found; build may update its assets."
          } else {
            Write-Host "No GitHub Release for $env:GITHUB_REF_NAME yet (exit $viewExit); continuing."
          }
          exit 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # 工具链按 rust-toolchain.toml 装。缓存只读 main 上 CI 的 Rust test 那份（cargo test 要全跑时用得上），
      # 不存：tag 上存的缓存只有同一个 tag 能读（GitHub 缓存按 ref 隔离），下一个 RC 读不到，
      # 以前每次发版都“No cache found”、再白花 2 分钟上传约 2 GB。
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
          save-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod

      - name: Audit Rust dependencies
        # 忽略的公告和理由写在 .cargo/audit.toml
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Verify tag and application version
        run: pnpm release:verify
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Test release tooling
        run: pnpm release:test

      - name: Look for a green CI run of this commit
        id: ci
        # 玩家同意（2026-11-25）：这个提交在 CI 上已经全绿，就不再跑一遍 pnpm check、Playwright、cargo test。
        # “全绿”：ci.yml 对这个提交（推送或手动触发）有一次运行整体是 success，而且 Rust lint、Rust test、
        # Frontend 三个 job 都是 success（不是被跳过）。tag 一般和 main 一起推，CI 这时还在跑：等它跑完，最多 25 分钟。
        # 找不到、查询出错、失败、被取消、等超时 → 照旧全跑（宁可多跑）。依赖审计、release:verify 每次都跑。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $sha = (git rev-parse HEAD).Trim()
          $required = @('Rust lint', 'Rust test', 'Frontend')
          function Complete-Check([bool]$tested, [string]$why) {
            Write-Host $why
            "tested=$($tested.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $started = Get-Date
          while ($true) {
            $out = (gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $sha `
              --limit 20 --json databaseId,status,conclusion,event 2>$null) -join "`n"
            if ($LASTEXITCODE -ne 0) { Complete-Check $false "Could not list CI runs for $sha; running all tests." }
            $all = $out | ConvertFrom-Json
            $runs = @($all | Where-Object { $_.event -in @('push', 'workflow_dispatch') })
            foreach ($run in @($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })) {
              $view = (gh run view $run.databaseId --repo $env:GITHUB_REPOSITORY --json jobs 2>$null) -join "`n"
              if ($LASTEXITCODE -ne 0) { continue }
              $jobs = @(($view | ConvertFrom-Json).jobs)
              $missing = @($required | Where-Object {
                $name = $_
                -not ($jobs | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' })
              })
              if ($missing.Count -eq 0) {
                Complete-Check $true "CI run $($run.databaseId) passed $($required -join ', ') on $sha; not running them again."
              }
              Write-Host "CI run $($run.databaseId) is green but did not pass: $($missing -join ', ')."
            }
            $minutes = ((Get-Date) - $started).TotalMinutes
            $pending = @($runs | Where-Object { $_.status -ne 'completed' })
            # 一次都还没有：多半是 tag 比 main 先推上来，等 2 分钟看 CI 会不会开始
            if ($pending.Count -eq 0 -and ($runs.Count -gt 0 -or $minutes -ge 2)) {
              Complete-Check $false "No green CI run on $sha; running all tests."
            }
            if ($minutes -ge 25) { Complete-Check $false "CI on $sha is still running after 25 minutes; running all tests." }
            Write-Host ("Waiting for CI on {0}: {1} run(s) in progress, {2:N0} min so far" -f $sha, $pending.Count, $minutes)
            Start-Sleep -Seconds 30
          }

      - name: Check desktop UI
        if: steps.ci.outputs.tested != 'true'
        run: pnpm check

      - name: Test desktop journeys
        if: steps.ci.outputs.tested != 'true'
        run: pnpm -C apps/desktop test:e2e

      - name: Test Rust workspace
        if: steps.ci.outputs.tested != 'true'
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build draft GitHub release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 签名（私钥与密码保管在仓库 Secrets；
          # 对应公钥写在 apps/desktop/src-tauri/tauri.conf.json 的 plugins.updater.pubkey）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Kotone ${{ github.ref_name }}"
          releaseBody: |
            面向 Windows 游戏玩家的本地语音输入工具。

            完整变更与安装说明见仓库中的 CHANGELOG 与 README。
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          uploadUpdaterJson: ${{ startsWith(github.ref_name, 'v0.1.') && !contains(github.ref_name, '-') }}
          generateReleaseNotes: true

      - name: Generate and upload updater manifests
        # tauri-action 会上传自己的 latest.json（api.github.com 临时 asset 地址）；
        # 这里重建 GitHub/COS 清单，并保留旧客户端所需的四个第三方镜像变体，
        # 以 --clobber 覆盖同名附件。
        shell: pwsh
        run: |
          $installer = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" } | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced."
          }
          node scripts/make-updater-jsons.mjs `
            --exe $installer.FullName `
            --sig "$($installer.FullName).sig" `
            --tag "${{ github.ref_name }}" `
            --cos-base-url "https://kotone-1258931230.cos.ap-guangzhou.myqcloud.com/releases"
          $dir = $installer.DirectoryName
          $assets = @((Join-Path $dir "latest-cos.json"))
          if ($env:GITHUB_REF_NAME -match '^v0\.1\.\d+$') {
            $legacyNames = @("latest.json", "latest-cn-ghfast.json", "latest-cn-ghproxy.json",
              "latest-cn-ghproxynet.json", "latest-cn-llkk.json")
            $assets += $legacyNames | ForEach-Object { Join-Path $dir $_ }
          }
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload updater manifests." }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload SHA-256 checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" }
          if (-not $installers) {
            throw "No NSIS installer was produced."
          }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE "SHA256SUMS.txt"
          $lines | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumPath --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable GitHub release and trigger COS
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v0\.1\.\d+$') {
            Write-Host "This release remains a draft. See ADR 027 before publishing the gated 0.2 channel."
            exit 0
          }
          gh release edit $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish stable GitHub Release." }

  publish-cos:
    needs: build-windows
    if: ${{ startsWith(github.ref_name, 'v0.1.') && !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish-cos.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
