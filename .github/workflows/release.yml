name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse to rebuild an already published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $json = gh release view $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($json | ConvertFrom-Json).isDraft) {
            throw "Release $env:GITHUB_REF_NAME is already published; refusing to overwrite its assets."
          }

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/desktop exec playwright install chromium

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Verify tag and application version
        run: pnpm release:verify
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Test release tooling
        run: pnpm release:test

      - name: Check desktop UI
        run: pnpm check

      - name: Test desktop journeys
        run: pnpm -C apps/desktop test:e2e

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build draft GitHub release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 签名（私钥与密码保管在仓库 Secrets；
          # 对应公钥写在 apps/desktop/src-tauri/tauri.conf.json 的 plugins.updater.pubkey）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Kotone ${{ github.ref_name }}"
          releaseBody: |
            面向 Windows 游戏玩家的本地语音输入工具。

            完整变更与安装说明见仓库中的 CHANGELOG 与 README。
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generateReleaseNotes: true

      - name: Generate and upload updater manifests
        # tauri-action 会上传自己的 latest.json（api.github.com 临时 asset 地址）；
        # 这里重建 GitHub/COS 清单，并保留旧客户端所需的四个第三方镜像变体，
        # 以 --clobber 覆盖同名附件。
        shell: pwsh
        run: |
          $installer = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" } | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced."
          }
          node scripts/make-updater-jsons.mjs `
            --exe $installer.FullName `
            --sig "$($installer.FullName).sig" `
            --tag "${{ github.ref_name }}" `
            --cos-base-url "https://kotone-1258931230.cos.ap-guangzhou.myqcloud.com/releases"
          $dir = $installer.DirectoryName
          gh release upload "${{ github.ref_name }}" `
            (Join-Path $dir "latest.json") `
            (Join-Path $dir "latest-cos.json") `
            (Join-Path $dir "latest-cn-ghfast.json") `
            (Join-Path $dir "latest-cn-ghproxy.json") `
            (Join-Path $dir "latest-cn-ghproxynet.json") `
            (Join-Path $dir "latest-cn-llkk.json") `
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload SHA-256 checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" }
          if (-not $installers) {
            throw "No NSIS installer was produced."
          }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE "SHA256SUMS.txt"
          $lines | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumPath --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable GitHub release and trigger COS
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "Prerelease tag remains a draft and will not enter the COS stable channel."
            exit 0
          }
          gh release edit $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish stable GitHub Release." }

  publish-cos:
    needs: build-windows
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish-cos.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
