[package]
name = "kotone-tauri"
version = "0.1.1"
description = "Kotone（琴音）— 游戏语音输入工具（Tauri 壳）"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 约定：核心逻辑放 lib，main.rs 只做入口
name = "kotone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# exe 名保持 kotone.exe（package 改名 kotone-tauri 不影响产物名）
[[bin]]
name = "kotone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 三个内部 crate：core（域模型/ports/状态机/配置）、stt（引擎）、platform（Windows 适配器）
kotone-core.workspace = true
kotone-stt.workspace = true
kotone-platform-windows.workspace = true

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# 进程资源占用（CPU/内存），供设置页实时展示
sysinfo = "0.30"

# 壳自身的窗口 UI 代码（SW_SHOWNA 不抢焦点显示；胶囊样式 SetWindowPos 居中定位）
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }
webview2-com = "0.38.2"

[dev-dependencies]
tempfile.workspace = true

[features]
# STT 引擎 feature 转发到 kotone-stt（§3.3）
# 默认内置 sherpa-onnx 引擎 + silero VAD（ADR-007 one-shot 静音判停开箱可用）；
# 裁剪体积可 --no-default-features 后按需开启
default = ["engine-sherpa", "vad-silero"]
engine-sherpa = ["kotone-stt/engine-sherpa"]
# VAD（ADR-007 one-shot 静音判停）：复用 sherpa-onnx 原生依赖
vad-silero = ["kotone-stt/vad-silero"]
