[package]
name = "kotone-tauri"
version = "0.2.0-rc.13"
description = "Kotone（琴音）— 游戏语音输入工具（Tauri 壳）"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 约定：核心逻辑放 lib，main.rs 只做入口
name = "kotone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# exe 名保持 kotone.exe（package 改名 kotone-tauri 不影响产物名）
# test = false：main.rs 只做入口、没有测试，不再为它把整个应用链接成一个空的测试程序（测试写在 lib 里）
[[bin]]
name = "kotone"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 内部能力 crate；桌面壳负责组合 core 端口、AI、识别、播报和平台实现。
kotone-core.workspace = true
kotone-ai.workspace = true
kotone-agent.workspace = true
kotone-tts.workspace = true
kotone-plugin-api.workspace = true
kotone-plugin-lol.workspace = true
kotone-plugin-game-voice.workspace = true
kotone-plugin-music.workspace = true
kotone-plugin-interpreter.workspace = true
kotone-plugin-voice-input.workspace = true
# 第三方插件（MCP 方案第 2 期）：一个第三方 MCP 服务器 = 一个远程插件（宿主那一半在 remote_plugins.rs）
kotone-remote-plugin.workspace = true
kotone-postprocess.workspace = true
kotone-stt.workspace = true
kotone-platform-windows.workspace = true
# 可选本机 Agent 工具服务（默认关闭，toolService.enabled）
kotone-tools.workspace = true
kotone-script.workspace = true
# 工具服务 OCR 后端（M2）：本地韩文 PP-OCRv5 与 DeepSeek 在线
kotone-ocr.workspace = true
# `kotone.exe <子命令>`：安装版只带一个 exe，Agent / 插件用它当命令行与 stdio MCP 服务器
kotone-cli.workspace = true

# unstable：聊天页右侧栏里的内置浏览器是主窗口的子网页视图（`Window::add_child`，ADR 031）
tauri = { version = "2", features = ["tray-icon", "unstable"] }
url = "2"
# 把 Tauri / wry 自己的警告和错误（log 库）转进 Kotone 的日志：例如子网页视图创建失败时只有这里有原因
log = "0.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# 更新包是 NSIS setup.exe（createUpdaterArtifacts = true），用不到 zip 解压；关掉 zip 特性，
# 也不再引入有公告的 zip 4.x（RUSTSEC-2026-0367/0368/0369/0429）。
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# 插件 MCP App 的回环代理（app_proxy.rs，ADR 039 D5）：和工具服务同一套 HTTP 库（版本已在工作区锁文件里）
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# 进程资源占用（CPU/内存），供设置页实时展示
sysinfo = "0.30"
# 脱敏诊断包 ZIP（版本已由 updater 间接锁定，显式依赖以供壳侧写包）
zip.workspace = true
dirs = "6"
tar = "0.4"
bzip2 = "0.4"
tempfile.workspace = true

# 壳自身的窗口 UI 代码（SW_SHOWNA 不抢焦点显示；胶囊样式 SetWindowPos 居中定位）
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
webview2-com = "0.38.2"

[dev-dependencies]
tempfile.workspace = true

[features]
# STT 引擎 feature 转发到 kotone-stt（§3.3）
# 默认内置 sherpa-onnx 引擎 + silero VAD（ADR-007 one-shot 静音判停开箱可用）；
# 裁剪体积可 --no-default-features 后按需开启
default = ["engine-sherpa", "vad-silero", "ocr-local"]
engine-sherpa = ["kotone-stt/engine-sherpa", "kotone-cli/engine-sherpa"]
# VAD（ADR-007 one-shot 静音判停）：复用 sherpa-onnx 原生依赖
vad-silero = ["kotone-stt/vad-silero", "kotone-cli/vad-silero"]
# 本地 OCR 推理：使用 sherpa-onnx 静态库内的 ONNX Runtime（不新增原生库）
ocr-local = ["kotone-ocr/onnx", "kotone-cli/ocr-local"]
