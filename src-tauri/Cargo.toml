[package]
name = "kotone-tauri"
version = "0.1.0"
description = "Kotone（琴音）— 游戏语音输入工具（Tauri 壳）"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 约定：核心逻辑放 lib，main.rs 只做入口
name = "kotone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# exe 名保持 kotone.exe（package 改名 kotone-tauri 不影响产物名）
[[bin]]
name = "kotone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 三个内部 crate：core（域模型/ports/状态机/配置）、stt（引擎）、platform（Windows 适配器）
kotone-core = { path = "../crates/kotone-core" }
kotone-stt = { path = "../crates/kotone-stt" }
kotone-platform-windows = { path = "../crates/kotone-platform-windows" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# 壳自身的窗口 UI 代码（SW_SHOWNA 不抢焦点显示）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[features]
# STT 引擎 feature 转发到 kotone-stt（§3.3）
default = []
engine-whisper-sidecar = ["kotone-stt/engine-whisper-sidecar"]
engine-sherpa = ["kotone-stt/engine-sherpa"]
