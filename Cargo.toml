[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*", "plugins/*"]

# 成员 crate 共有依赖统一在此声明（版本只此一处），成员用 `xxx.workspace = true` 引用
[workspace.dependencies]
# 内部 crate（路径相对 workspace 根）
kotone-core = { path = "crates/kotone-core" }
kotone-ai = { path = "crates/kotone-ai" }
kotone-agent = { path = "crates/kotone-agent" }
kotone-tts = { path = "crates/kotone-tts" }
kotone-postprocess = { path = "crates/kotone-postprocess" }
kotone-stt = { path = "crates/kotone-stt" }
kotone-platform-windows = { path = "crates/kotone-platform-windows" }
kotone-tools = { path = "crates/kotone-tools" }
kotone-ocr = { path = "crates/kotone-ocr" }
kotone-script = { path = "crates/kotone-script" }
kotone-exec = { path = "crates/kotone-exec" }
kotone-plugin-api = { path = "crates/kotone-plugin-api" }
# MCP 客户端（MCP 方案第 1 期）：协议客户端库，插件可以依赖（ADR 038 D6）
kotone-mcp = { path = "crates/kotone-mcp" }
# 第三方插件（MCP 方案第 2 期）：一个第三方 MCP 服务器 = 一个远程插件
kotone-remote-plugin = { path = "crates/kotone-remote-plugin" }
# 插件（ADR 038：plugins/<id>/，一期都是内置的，编译在一起）
kotone-plugin-lol = { path = "plugins/lol" }
kotone-plugin-game-voice = { path = "plugins/game-voice" }
kotone-plugin-music = { path = "plugins/music" }
kotone-plugin-interpreter = { path = "plugins/interpreter" }
kotone-plugin-voice-input = { path = "plugins/voice-input" }
kotone-plugin-cs2 = { path = "plugins/cs2" }
# 桌面端 `kotone.exe <子命令>` 复用 CLI；特性由桌面端按自身特性转发
kotone-cli = { path = "crates/kotone-cli", default-features = false }

# 通用依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# raw Win32（features 由各成员按需追加，可叠加）
windows = "0.61"
# profile 导入导出（.kprofile ZIP 包；deflate 同时满足读/写）
zip = { version = "9", default-features = false, features = ["deflate"] }

# 测试
tempfile = "3"

[profile.dev]
# 降低 debuginfo 为 line-tables-only，大幅缩减 MSVC PDB 和链接器内存
debug = 1

[profile.test]
# 避免多个测试二进制并行生成超大 PDB 引起内存溢出与 STATUS_STACK_BUFFER_OVERRUN
debug = 1
