[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*"]

# 成员 crate 共有依赖统一在此声明（版本只此一处），成员用 `xxx.workspace = true` 引用
[workspace.dependencies]
# 内部 crate（路径相对 workspace 根）
kotone-core = { path = "crates/kotone-core" }
kotone-stt = { path = "crates/kotone-stt" }
kotone-platform-windows = { path = "crates/kotone-platform-windows" }

# 通用依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# raw Win32（features 由各成员按需追加，可叠加）
windows = "0.61"

# 测试
tempfile = "3"
