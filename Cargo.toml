[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*"]

# 成员 crate 共有依赖统一在此声明（版本只此一处），成员用 `xxx.workspace = true` 引用
[workspace.dependencies]
# 内部 crate（路径相对 workspace 根）
kotone-core = { path = "crates/kotone-core" }
kotone-postprocess = { path = "crates/kotone-postprocess" }
kotone-stt = { path = "crates/kotone-stt" }
kotone-platform-windows = { path = "crates/kotone-platform-windows" }

# 通用依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# raw Win32（features 由各成员按需追加，可叠加）
windows = "0.61"
# profile 导入导出（.kprofile ZIP 包；deflate 同时满足读/写）
zip = { version = "4", default-features = false, features = ["deflate"] }

# 测试
tempfile = "3"

[profile.dev]
# 降低 debuginfo 为 line-tables-only，大幅缩减 MSVC PDB 和链接器内存
debug = 1

[profile.test]
# 避免多个测试二进制并行生成超大 PDB 引起内存溢出与 STATUS_STACK_BUFFER_OVERRUN
debug = 1
