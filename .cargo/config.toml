# Cargo 构建与并发保护配置
# 防止大型 C++ 静态库（sherpa-onnx / onnxruntime）并发链接导致内存爆满与系统冻结

[build]
# 串行构建，避免多个 MSVC link.exe 同时链接超大静态库耗尽提交内存。
# 并行 2 任务已复现 Windows 1455，本地保持这个保守默认值。CI 用环境变量 CARGO_BUILD_JOBS 覆盖
# （clippy 4、test 2，见 .github/workflows/ci.yml）；`pnpm prepush` 也自己传 -j。
jobs = 1

[env]
# C++ 依赖统一用静态 C++ 运行时（/MT），与 sherpa-onnx 的 static-MT 预编译库一致。
# 否则 cc 默认以 /MD 编译的 C++ 代码（如 Luau，kotone-script）会把 msvcprt 与 sherpa 的
# libcpmt 一起拉进链接，产生 LNK2005 重复定义。只影响 C++（CXXFLAGS），不影响纯 C 依赖。
CXXFLAGS_x86_64_pc_windows_msvc = "/MT"
