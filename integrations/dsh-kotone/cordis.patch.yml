# dsh-kotone —— bundle 自带的挂载声明（profile 的 dsh.profile.bundles 列出 dsh-kotone 即生效）
#
#   dsh plugin --profile web add link:<本目录>     # 本地开发
#
# 两部分：
#   1. kotone-mcp：Kotone 的 MCP 服务器（`kotone-cli mcp`，stdio）。Agent 用 kotone_* 工具
#      启动/退出 Kotone、截图、OCR、读事件、给用户语音/弹幕回复……
#   2. kotone：反向通道。用户在 Kotone 里按热键说话（assistant.route = agent）时，
#      把请求领取下来投进 DSH 的「Kotone」会话，由 Agent 处理并经 kotone_agent_reply 回复。
#
# kotone-cli 的位置：环境变量 KOTONE_CLI，缺省在 PATH 里找 kotone-cli。
# 隔离运行：KOTONE_HOME（Kotone 数据目录）与 KOTONE_TOOL_SERVICE_DIR 原样传给子进程。

- insert:
    - id: kotone-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kotone
        transport: stdio
        command: !!js process.env.KOTONE_CLI || 'kotone-cli'
        args:
          - mcp
        failOnStartupError: false
    - id: kotone
      name: dsh-kotone
      config: {}
