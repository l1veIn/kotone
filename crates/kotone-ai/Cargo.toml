[package]
name = "kotone-ai"
version = "0.1.0"
edition = "2021"
description = "Kotone shared AI transport, credentials, reminder planning and the built-in agent loop"

[dependencies]
kotone-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
# 内置 Agent 的模型通信层（ADR 015）。0.x 接口变化快：钉死版本，升级时只改 agent/model.rs。
rig-core = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", default-features = false }
# rig 走 reqwest 0.13。不用它的 rustls 特性（会引入 aws-lc 这个 C 加密库）；自建客户端，
# 加密用 ring，与 Kotone 其余部分一致。
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
