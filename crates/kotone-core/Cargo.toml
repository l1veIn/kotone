[package]
name = "kotone-core"
version = "0.1.1"
description = "Kotone 核心：域模型 + ports + 状态机 + 事件 + 配置/profile/eval/log"
edition = "2021"
rust-version = "1.77.2"

# 依赖纪律：只允许轻量通用依赖；不得依赖 cpal/windows/tauri/任何 STT 引擎 SDK
[dependencies]
# 自动化定时（类似 crontab）的本地时间计算；版本已在工作区锁文件里
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
dirs = "6"
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
# orchestrator 测试需要 mock-stream 引擎（dev 依赖环是 Cargo 允许的：
# kotone-stt 正常依赖 kotone-core，kotone-core 仅测试依赖 kotone-stt）
kotone-stt.workspace = true
kotone-postprocess.workspace = true
# 听写听到以后（文字处理、发送、识别记录）在语音输入插件里；tests/orchestrator.rs 把它接上（同样是 dev 依赖环）
kotone-plugin-voice-input.workspace = true
