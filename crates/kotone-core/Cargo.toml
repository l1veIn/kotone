[package]
name = "kotone-core"
version = "0.1.1"
description = "Kotone 核心：域模型 + ports + 状态机 + 事件 + 配置/profile/eval/log"
edition = "2021"
rust-version = "1.77.2"

# 依赖纪律：只允许轻量通用依赖；不得依赖 cpal/windows/tauri/任何 STT 引擎 SDK
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs = "6"
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
# orchestrator 测试需要 mock-stream 引擎（dev 依赖环是 Cargo 允许的：
# kotone-stt 正常依赖 kotone-core，kotone-core 仅测试依赖 kotone-stt）
kotone-stt.workspace = true
