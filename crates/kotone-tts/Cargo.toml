[package]
name = "kotone-tts"
version = "0.1.0"
description = "Kotone speech synthesis: Kokoro, online engines (OpenAI-compatible, Volcano), synthesis cache and cancellable PCM output"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
kotone-core.workspace = true
sherpa-onnx = "1.13.5"
cpal = "0.15"
serde_json.workspace = true
base64 = "0.22"
# 在线语音合成（OpenAI 兼容 / 火山）：在推理工作线程里同步请求；与 kotone-stt 同一版本
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# DeepSeek 流式语音合成 WebSocket（与 kotone-stt 讯飞 / 火山流式识别同一个库、同一个版本）
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# SpeechStream::finish 的异步等待（只用 tokio::sync，不需要运行时）
tokio.workspace = true
# 等待短句落盘的文件名（缓存键的哈希；与 kotone-core 同一版本）
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
