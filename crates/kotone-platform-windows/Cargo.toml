[package]
name = "kotone-platform-windows"
version = "0.1.0"
description = "Kotone Windows 平台适配器：cpal 音频、SendInput 注入、LL hook 热键、elevation"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
kotone-core = { path = "../kotone-core" }
tokio = { version = "1", features = ["full"] }
# 音频采集（docs/development.md §2：cpal 为 Rust 跨平台音频采集事实标准）
cpal = "0.15"

# 输入注入 / LL 钩子 / 提权检测：raw windows crate 直调 Win32
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    # 提权检测（TokenElevation）与 runas 重启（docs/development.md §10 R-1）
    # ShellExecuteExW 门控于 Win32_System_Registry（旧构建靠 tauri 传递开启）
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }
arboard = "3"
