[package]
name = "kotone-cli"
version = "0.1.0"
description = "Kotone 命令行前端：send 注入 / listen 全链路（wav 直灌+虚拟声卡）/ config / devices / play / eval"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
kotone-core.workspace = true
kotone-stt.workspace = true
kotone-platform-windows.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde_json.workspace = true

[features]
# STT 引擎 feature 转发到 kotone-stt（与 kotone-tauri 对齐）。
# CLI 是开发/自动化工具：默认带 sherpa（50MB 原生库无所谓）与 silero VAD；
# kotone-tauri 保持默认关（注意：cargo build --workspace 会按 feature
# 统一把 sherpa 编进同次构建的全部产物；发布壳用 -p kotone-tauri 单独构建）
default = ["engine-sherpa", "vad-silero"]
engine-sherpa = ["kotone-stt/engine-sherpa"]
# silero VAD（ADR-007 one-shot 静音判停）
vad-silero = ["kotone-stt/vad-silero"]
