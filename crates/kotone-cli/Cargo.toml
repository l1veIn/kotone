[package]
name = "kotone-cli"
version = "0.1.0"
description = "Kotone 命令行前端：send 一次性注入 / listen 无 Tauri 全链路 / eval（stub）"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
kotone-core = { path = "../kotone-core" }
kotone-stt = { path = "../kotone-stt" }
kotone-platform-windows = { path = "../kotone-platform-windows" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
