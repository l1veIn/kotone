[package]
name = "kotone-cli"
version = "0.1.0"
description = "Kotone 命令行前端：send 一次性注入 / listen 无 Tauri 全链路 / eval（stub）"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
kotone-core.workspace = true
kotone-stt.workspace = true
kotone-platform-windows.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde_json.workspace = true

[features]
# STT 引擎 feature 转发到 kotone-stt（与 kotone-tauri 对齐）
default = []
engine-whisper-sidecar = ["kotone-stt/engine-whisper-sidecar"]
engine-sherpa = ["kotone-stt/engine-sherpa"]
