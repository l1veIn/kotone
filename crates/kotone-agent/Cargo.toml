[package]
name = "kotone-agent"
version = "0.1.0"
edition = "2021"
description = "Kotone 内置 Agent 的运行框架层：工具清单接入、分组与查找、权限规则与询问、已保存自动化作为工具（ADR 014 / 015）"

# 依赖纪律：循环与模型在 kotone-ai；工具实现在 kotone-tools；本 crate 只做 Kotone 专属的编排，
# 不依赖 Tauri 与 Windows API（桌面专属动作经 BuiltinHost / Asker 端口注入）。
# kotone-exec（ADR 030 执行命令、读写文件）和 kotone-tools 一样把 Windows API 封在自己里面：
# 这里用它的工具说明，并转出给桌面端（`kotone_agent::exec`），由桌面端经 BuiltinHost::exec 执行。
[dependencies]
kotone-core.workspace = true
kotone-ai.workspace = true
kotone-tools.workspace = true
kotone-exec.workspace = true
# 插件契约（ADR 038）：开着的插件给她的工具和话（`Offer`），由桌面端按开关算好交进来
kotone-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2 = "0.10"
# 内置浏览器（ADR 031）的网址检查
url = "2"

[dev-dependencies]
tempfile.workspace = true
# 游戏语音插件的工具：搬进插件以后默认问不问和以前一样（tests.rs）
kotone-plugin-game-voice.workspace = true
# 语音输入插件的 game_chat.send：搬进插件以后权限、主会话、只读模式和以前一样（tests.rs）
kotone-plugin-voice-input.workspace = true
kotone-tools = { workspace = true, features = ["test-support"] }
wiremock = "0.6"
