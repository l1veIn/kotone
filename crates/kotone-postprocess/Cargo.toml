[package]
name = "kotone-postprocess"
version = "0.1.0"
description = "Kotone 文本后处理器实现与内置注册入口"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
kotone-core.workspace = true
kotone-ai.workspace = true
# 自定义词表可能被 WPS/Excel/记事本另存为 GBK/UTF-16，encoding_rs 负责兜底解码
encoding_rs = "0.8"
# HTTP 传输与凭据事务由 kotone-ai 共享；这里保留处理器持有的客户端。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
wiremock = "0.6"
