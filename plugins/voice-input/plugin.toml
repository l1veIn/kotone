# 语音输入插件（ADR 038 D4）：按语音输入热键说话，说的话（文字处理以后）打进游戏聊天框。
# 录音和语音识别（“听一句”）、往游戏聊天里打字（注入器、ADR 032 的挡键）都在本体，这里借用它们，管的是听到以后的事
# （ADR 039 D2）。清单的写法见 crates/kotone-plugin-api。
# 关掉 = 语音输入热键、悬浮窗、文字处理、识别记录一起停；呼叫她、唤醒词、她替你在聊天框发言（本体的 game_chat.send）不受影响。
# 界面文字以 messages/<语言>.json 为准（plugin_voice_input_*）。

id = "voice-input"
name = "语音输入"
description = "按住语音输入热键说话，说的话打进游戏聊天框（可以先过屏蔽词、润色、翻译）"
enabled_by_default = true

[[pages]]
uri = "ui://kotone/voice-input/home"
title = "语音输入"

# 能绑热键的命令（ADR 040 D1）：宿主在按下 / 松开时经本体的“听一句”调插件（AfterHearing::command）。
# 只登记命令，不带默认键（D4；新装时“说话”的 CapsLock 写在本体的默认设置里）。都要语音识别（listens）：
# 识别没在跑时键照常给游戏，按了在悬浮窗提示（ADR 040 实施记录，主会话定的第 2 条）。
# 名字是热键表里那一行的名字；界面文字以 messages 为准（plugin_voice_input_command_<id>_name）。
[[commands]]
id = "talk"
name = "语音输入热键"
description = "按住说话、松开发出去；按一下开始还是按住说，看“输入”里的交互模式"
kind = "hold"
listens = true

[[commands]]
id = "channel-cycle"
name = "频道切换热键"
description = "在这个游戏的聊天频道之间切换（队伍 / 所有人）"
listens = true

[[commands]]
id = "resend-last"
name = "重发最近一条热键"
description = "把上一句发成功的话再发一次"
listens = true

[[commands]]
id = "post-process-toggle"
name = "文字处理开关热键"
description = "屏蔽词、润色、翻译一起开或关"
listens = true

[[commands]]
id = "post-process-cycle"
name = "切换文字处理流程热键"
description = "换到下一个文字处理方案"
listens = true
