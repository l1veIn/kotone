# 语音输入插件（ADR 038 D4）：按语音输入热键说话，说的话（文字处理以后）打进游戏聊天框。
# 录音和语音识别（“听一句”）、往游戏聊天里打字（注入器、ADR 032 的挡键）都在本体，这里借用它们，管的是听到以后的事
# （ADR 039 D2）。清单的写法见 crates/kotone-plugin-api。
# 关掉 = 语音输入热键、悬浮窗、文字处理、识别记录一起停；呼叫她、唤醒词、她替你在聊天框发言（本体的 game_chat.send）不受影响。
# 界面文字以 messages/<语言>.json 为准（plugin_voice_input_*）。

id = "voice-input"
name = "语音输入"
description = "按住语音输入热键说话，说的话打进游戏聊天框（可以先过屏蔽词、润色、翻译）"
enabled_by_default = true

[[pages]]
uri = "ui://kotone/voice-input/home"
title = "语音输入"
