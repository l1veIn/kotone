# 英雄联盟插件（ADR 035、036、038）。清单的写法见 crates/kotone-plugin-api。
# 界面上的文字以 messages/<语言>.json 为准（plugin_lol_*）；这里的中文给她（系统提示）、工具服务和设置说明用，
# 两边要一致（tests::messages_match_the_manifest）。

id = "lol"
name = "英雄联盟"
description = "这局 10 个人的战绩和突破口、任何人的战绩、记对面交的召唤师技能；英雄的强度、克制、出装和海斗海克斯"
games = ["lol"]
adapter = "lol"
enabled_by_default = true

[[sources]]
id = "client"
name = "读客户端数据"
description = "读英雄联盟客户端和对局里的本地接口（只读，不改任何东西）：查这局玩家的战绩、找对面的突破口、记对面交的召唤师技能；游戏中心靠它知道选英雄、加载、对局中这些阶段和局内的事。"
enabled_by_default = true
risk = "国服用这类功能可能违反腾讯的用户协议，LeagueAkari 等工具有封号、禁言的报告；Riot 也限制第三方的技能冷却计时。用不用由你决定。"

[[sources]]
id = "stats"
name = "用网上的统计"
description = "从网上查英雄联盟的统计（国服）：腾讯 101 / 掌盟的峡谷强度榜、克制、出装、符文、加点和海斗英雄榜；czgreat/aramhex-data 的海斗英雄 × 海克斯胜率；腾讯的英雄外号。只按需请求（打开页面、她问的时候），不带你的账号。"
enabled_by_default = true
risk = "数据来自腾讯和 aramhex 的非官方接口，没有文档、随时可能变或停；aramhex 的数据是 CC BY-NC 4.0，要署名、不能商用（Kotone 不收费，页面上写了出处）。"

[[sources]]
id = "opgg"
name = "用 OP.GG 的数据"
description = "用 OP.GG 官方 MCP 补充全球数据（英雄的出装、克制分析），只在打开英雄页面、她查一个英雄的时候请求，存 24 小时；页面上写 OP.GG 的出处和链接。"
enabled_by_default = false
risk = "已经替你去问 OP.GG 能不能在 Kotone 里用（github.com/opgginc/opgg-mcp/issues/26）；OP.GG 回复同意前默认关。网站协议不许程序自动访问，打开就是你自己决定先用。"

[[sources]]
id = "control"
name = "操作客户端"
description = "照 LeagueAkari 操作英雄联盟客户端：自动接受对局、按你排好的顺序自动选 / 禁英雄；你说了才让她替你接受对局、选或禁某个英雄。读和写都只走客户端自己的本机接口，不读游戏内存、不注入。要“读客户端数据”也开着。"
enabled_by_default = false
risk = "外服有人用了自动接受、自动选英雄后被永久封号（LeagueAkari 的 github.com/LeagueAkari/LeagueAkari/issues/523），国服也可能违反腾讯的用户协议。默认关，打开就是你自己决定承担这个风险。"

[[sources]]
id = "chat"
name = "在客户端里发聊天"
description = "选英雄、房间里，你用语音输入说的话、她替你发的话，经客户端自己的本机聊天接口发出去，不按键（照 LeagueAkari）。几行连成一条消息发。只在你说话、让她发、或者你设的热键和自动化要发的时候发。要“读客户端数据”也开着。"
enabled_by_default = true
risk = "国服用第三方工具可能违反腾讯的用户协议；经接口发的话照样过腾讯的屏蔽词和禁言规则（LeagueAkari 用户报告过模板里的词被屏蔽：github.com/LeagueAkari/LeagueAkari/issues/480；WeGame 去掉了能改内容的一键喊话：github.com/LeagueAkari/LeagueAkari/issues/524）。Riot 说客户端接口不正式支持第三方使用（developer.riotgames.com/docs/lol）。关掉以后，选英雄时她不替你发；你自己的语音输入照旧按键打进前台窗口。"

[[pages]]
uri = "ui://kotone/lol/match"
title = "这局"
needs = ["client"]

[[pages]]
uri = "ui://kotone/lol/player"
title = "战绩"
needs = ["client"]

[[pages]]
uri = "ui://kotone/lol/game"
title = "单局详情"
needs = ["client"]

[[pages]]
uri = "ui://kotone/lol/champion"
title = "英雄"
needs = ["stats"]

[[pages]]
uri = "ui://kotone/lol/tier"
title = "强度榜"
needs = ["stats"]

[[pages]]
uri = "ui://kotone/lol/settings"
title = "设置"

# 发到游戏（ADR 041 D3，第 2 期）：英雄联盟客户端在前台时（选英雄、房间里），宿主把要发的话交给这个插件
# （Plugin::send_to_game），经客户端的聊天接口发，不按键。对局里（League of Legends.exe 在前台）照旧是本体的通用发法：
# 游戏配置里英雄联盟的聊天键、频道和时序就是英雄联盟的规矩。
[[send_to_game]]
game = "lol"
windows = ["LeagueClientUx.exe"]
needs = ["client", "chat"]

# 一键喊话（ADR 041 第 3 期，照 LeagueAkari 的“游戏内发送”预设）：能绑热键的命令（ADR 040 D1 的第二种：调自己的工具、
# 带固定参数）。热键表里列出来、不带默认键（D4），玩家在「设置 → 热键」录键；按下时宿主照 lol.shout 的权限调它，
# lol.shout 现生成几行、经本体唯一的发话入口发（插件不按键）。界面上的名字在 messages 里（plugin_lol_command_<id>_name）。
[[commands]]
id = "shout-enemy-flash"
name = "喊对面闪现"
description = "把对面谁的闪现没好、几点好（你报过的）和谁没带闪发到队伍聊天"
tool = "lol.shout"
args = { what = "flash", side = "enemy", channel = "team" }

[[commands]]
id = "shout-enemy-records"
name = "喊对面战绩"
description = "把对面每个人的段位、近 20 局胜负、KDA、连胜连败发到队伍聊天（一人一行）"
tool = "lol.shout"
args = { what = "records", side = "enemy", channel = "team" }

[[commands]]
id = "shout-ally-records"
name = "喊我方战绩"
description = "把我方每个人的段位、近 20 局胜负、KDA、连胜连败发到队伍聊天（一人一行）"
tool = "lol.shout"
args = { what = "records", side = "ally", channel = "team" }

[[commands]]
id = "shout-premade"
name = "喊开黑情况"
description = "把两边谁和谁开黑发到队伍聊天"
tool = "lol.shout"
args = { what = "premade", side = "all", channel = "team" }

# 覆盖层（照 aramhex）：选英雄时的胜率、海斗三选一时贴在卡片上的海克斯评分
[[overlays]]
uri = "ui://kotone/lol/champ-select"
title = "选英雄"
needs = ["client", "stats"]

[[overlays]]
uri = "ui://kotone/lol/augment-scores"
title = "海克斯评分"
needs = ["stats"]

# 游戏中心的事（ADR 036 D4）：lol 适配器报给游戏中心的局内事件，自动化按它们触发、保存时按这里校验，
# game.state 和自动化编辑里的选择也从这里来。都来自局内接口（事件列表和玩家列表），要“读客户端数据”开着。
# label 是界面上的名字（messages 里 plugin_lol_event_<名字> 要和它一致）；data 是事件数据的字段和说明（camelCase）。
# 插件只报得出这里登记过的（tests::every_emitted_event_is_registered 查）。
[[events]]
type = "lol.first_blood"
label = "一血"
needs = ["client"]
data.team = "哪一边：ally（我方）/ enemy（对面）"
data.killer = "拿一血的英雄"

[[events]]
type = "lol.dragon_kill"
label = "拿了小龙"
needs = ["client"]
data.team = "哪一边：ally（我方）/ enemy（对面）"
data.dragon = "哪条龙：fire / water / earth / air / hextech / chemtech / elder"
data.dragonName = "龙的中文名（火龙、远古龙……），播报用"
data.stolen = "是不是抢的"

[[events]]
type = "lol.herald_kill"
label = "拿了峡谷先锋"
needs = ["client"]
data.team = "哪一边：ally（我方）/ enemy（对面）"
data.stolen = "是不是抢的"

[[events]]
type = "lol.baron_kill"
label = "拿了大龙"
needs = ["client"]
data.team = "哪一边：ally（我方）/ enemy（对面）"
data.stolen = "是不是抢的"

[[events]]
type = "lol.turret_killed"
label = "推掉一座塔"
needs = ["client"]
data.team = "哪一边推的：ally（我方）/ enemy（对面）"

[[events]]
type = "lol.inhib_killed"
label = "推掉一个水晶"
needs = ["client"]
data.team = "哪一边推的：ally（我方）/ enemy（对面）"

[[events]]
type = "lol.ace"
label = "团灭"
needs = ["client"]
data.team = "团灭了对面的是哪一边：ally（我方）/ enemy（对面）"

[[events]]
type = "lol.multikill"
label = "三杀以上"
needs = ["client"]
data.team = "哪一边：ally（我方）/ enemy（对面）"
data.killer = "英雄"
data.count = "几杀：3 / 4 / 5"

[[events]]
type = "lol.my_death"
label = "我阵亡了"
needs = ["client"]
data.respawnSeconds = "多少秒后复活"

[[events]]
type = "lol.my_respawn"
label = "我复活了"
needs = ["client"]

[agent]
overview = "英雄联盟里查这局玩家的战绩和突破口、查任何人的战绩、记对面交的召唤师技能，查英雄的强度、克制、出装和海斗海克斯"
rule = """- 英雄联盟（读本机的客户端和局内接口，马上返回）：这局的样子、“谁没闪”“对面谁没带闪”用 lol.match；\
玩家说“对面阿狸闪了”就用 lol.spell 记下（不用问），简短应一声几点好；“查战绩”“对面谁是突破口”用 lol.scout，\
挑一两个最值得说的用信息的口吻说（“对面辅助最近五连败、劫最近没玩过”），不下命令，隐藏战绩的提一句；\
“我最近怎么样”“查一下对面亚索 / 某某#1234 的战绩”用 lol.player；\
“亚索克制谁”“刀妹出什么”“海斗里这个英雄拿什么海克斯”用 lol.champion，“现在什么英雄强”用 lol.tier，说的时候带一句出处（“掌盟的数据”）。\
玩家说“帮我接受对局”“帮我选 / 禁 亚索”“先亮一下亚索”才用 lol.client（操作客户端，玩家没说就不用）。\
玩家说了“发出去 / 发聊天框”才用 game_chat.send 发（选英雄、房间里也是它：客户端在前台时经客户端的聊天接口发，只有队伍频道）：\
技能发 lol.spell 返回的 chat 那句，战绩一条一行；“把对面闪现 / 战绩 / 开黑发出去”用 lol.shout（一次调用、措辞固定、不发玩家名）。
"""
