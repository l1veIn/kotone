data.dragonName = "龙的中文名（火龙、远古龙……），播报用"
data.stolen = "是不是抢的"

[[events]]
type = "lol.herald_kill"
label = "拿了峡谷先锋"
needs = ["client"]
data.team = "哪一边：ally（我方）/ enemy（对面）"
data.stolen = "是不是抢的"

[[events]]
type = "lol.baron_kill"
label = "拿了大龙"
