# 放歌插件（ADR 034、038）：网易云音乐 + Kotone 自己的播放器。显示名“网易云音乐”（交接第十一节第 7 条；id、配置路径、工具名还是 music）。清单的写法见 crates/kotone-plugin-api。
# 界面文字以 messages/<语言>.json 为准（plugin_music_*）。放歌以前一直都在，所以默认开。

id = "music"
name = "网易云音乐"
description = "放网易云音乐：搜歌、每日推荐、我喜欢的、私人 FM、你的歌单，Kotone 自己放；她说话时音乐自动压低"
enabled_by_default = true

[[pages]]
uri = "ui://kotone/music/home"
title = "网易云音乐"

# 推送的卡片（ADR 043 D11）：聊天里的卡片和点开以后右侧栏里的样子，数据见 src/login_push.rs
[[pages]]
uri = "ui://kotone/music/login"
title = "登录过期"

# 内置推送（ADR 043 D4、D11）：网易云音乐主要是 App 加工具，内置推送只做必要的这一条。插件页「设置 → 推送」里一个开关，
# 宿主执行。同一次过期只有一张卡片；不给她留说明（她要放歌时工具会告诉她要登录）。
[[pushes]]
id = "login"
title = "登录过期"
when = "网易云音乐的登录过期了（以前登录过，网易云说要重新登录）"
what = "发一张卡片，上面有“登录网易云音乐”按钮（打开网易云官方的登录页，用网易云音乐 App 扫码）；登好了这张卡片原地变成“已登录”"
forms = ["card"]

[agent]
overview = "放网易云的歌（搜歌、每日推荐、我喜欢的、私人 FM、歌单），马上出声"
rule = """- 歌：放歌、暂停、切歌、这首歌叫什么、红心都用 music 马上做，不交给后台（Kotone 自己放网易云的歌，不用网页放）。\
玩家要听某首歌就 play 带 query；“每日推荐”“我喜欢的”“私人 FM”“xx 歌单”用 from。\
结果里跳过了的歌（要 VIP、没版权）照实说一句；返回 need_login 就照它的 note 请玩家点“登录网易云音乐”扫码（没登录过的在插件页面或聊天页点，登录过期的点聊天里“登录过期”卡片上的）。\n\
"""

# 参考（ADR 049 D7）：照着写的开源项目，只在「插件信息」里列出来；许可和改写了哪些在仓库的 THIRD_PARTY_NOTICES.md。
[[references]]
name = "NeteaseCloudMusicApi Enhanced"
url = "https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced"

[[references]]
name = "ncmapi-rs"
url = "https://github.com/two-mountains/ncmapi-rs"

[[references]]
name = "YesPlayMusic"
url = "https://github.com/qier222/YesPlayMusic"
